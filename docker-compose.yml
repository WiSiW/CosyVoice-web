# ===========================================================================
# 本地/服务器编排
#
# ⚠️ 后端没有任何模拟推理路径：如果模型权重没准备好，容器会以 state=error 启动，
#    并通过 /api/v1/system/info 返回明确原因。
#
# 使用前请先准备好权重：
#   bash scripts/setup_cosyvoice.sh
#
# 真实 GPU 推理需要 NVIDIA Container Toolkit，请把 backend 的镜像换成 CUDA 基础镜像
# 并安装 torch（见 backend/Dockerfile 顶部说明）。
# ===========================================================================
services:
  backend:
    build:
      context: ./backend
      args:
        # 置为 true 会在镜像内安装 torch 等推理依赖（体积大、构建慢）
        INSTALL_INFERENCE_DEPS: "false"
    container_name: cosyvoice-backend
    ports:
      - "8000:8000"
    environment:
      CV_HOST: 0.0.0.0
      CV_PORT: "8000"
      CV_DATA_DIR: /data
      CV_COSYVOICE_REPO: /opt/CosyVoice
      CV_MODEL_DIR: /opt/CosyVoice/pretrained_models/CosyVoice2-0.5B
      CV_PRELOAD_MODEL: "true"
      CV_CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
    volumes:
      # 只读挂载官方仓库与权重
      - ./CosyVoice:/opt/CosyVoice:ro
      - ./data:/data
    restart: unless-stopped
    # 需要 GPU 时取消注释并确保宿主机已安装 NVIDIA Container Toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  frontend:
    image: node:22-alpine
    container_name: cosyvoice-frontend
    working_dir: /app
    command: sh -c "npm install && npm run build && npx vite preview --host 0.0.0.0 --port 8080"
    ports:
      - "8080:8080"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    restart: unless-stopped
